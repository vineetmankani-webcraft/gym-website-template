name: Validate website and admin
on:
  pull_request:
  push:
    branches: [main, feature/admin-portal, 'admin-preview/**']
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx wrangler pages functions build --outdir .wrangler/functions-check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
